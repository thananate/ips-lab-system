<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Lab System | Procurement & Purchase Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="sharedHeader" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"></div>

      <!-- QUICK LOW-STOCK REPLENISHMENT BANNER -->
      <div id="lowStockBanner" class="hidden glass-card rounded-2xl p-4 border-l-4 border-l-rose-500">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
          <h4 class="font-bold text-xs text-rose-700 flex items-center gap-1.5">
            <i data-lucide="alert-triangle" class="w-4 h-4"></i> Low Stock Items Requiring Replenishment
          </h4>
          <span class="text-[11px] text-slate-400">Click "+ Quick PR" to pre-fill a purchase request</span>
        </div>
        <div id="lowStockChips" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- FILTER & ACTION BAR -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap gap-1.5 bg-white/80 p-1.5 rounded-2xl border border-slate-200/70">
          <button onclick="statusFilter='All'; renderTable();" class="p-btn px-3 py-1.5 rounded-xl text-xs font-medium bg-indigo-600 text-white" data-st="All">All Orders</button>
          <button onclick="statusFilter='Open'; renderTable();" class="p-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-st="Open">Open / Pending</button>
          <button onclick="statusFilter='Ordered'; renderTable();" class="p-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-st="Ordered">Ordered</button>
          <button onclick="statusFilter='Received'; renderTable();" class="p-btn px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-st="Received">Received</button>
        </div>

        <div class="flex items-center gap-2">
          <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Search PR ID, Item, Supplier..." class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-xs w-56" />
          <button onclick="openPurchaseModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white text-xs font-medium shadow hover:opacity-95 flex items-center gap-1.5">
            <i data-lucide
