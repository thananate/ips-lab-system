<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Lab System | Inventory & Stock Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="sharedHeader" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"></div>

      <!-- EXPIRY & LOW STOCK SUMMARY BANNER -->
      <div id="expiryAlertBanner" class="hidden glass-card rounded-2xl p-4 border-l-4 border-l-amber-500">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
          <h4 class="font-bold text-xs text-amber-800 flex items-center gap-1.5">
            <i data-lucide="calendar-clock" class="w-4 h-4 text-amber-600"></i> Chemical / Consumable Expiry Alerts (Expired or Expiring within 60 Days)
          </h4>
        </div>
        <div id="expiryAlertList" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- LAB FILTER & ACTION BUTTONS -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap gap-1.5 bg-white/80 p-1.5 rounded-2xl border border-slate-200/70">
          <button onclick="activeLab='All'; renderAll();" class="lab-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-indigo-600 text-white" data-lab="All">All Labs</button>
          <button onclick="activeLab='Primary'; renderAll();" class="lab-btn px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-lab="Primary">Primary Lab</button>
          <button onclick="activeLab='Physics'; renderAll();" class="lab-btn px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-lab="Physics">Physics Lab</button>
          <button onclick="activeLab='Chemistry'; renderAll();" class="lab-btn px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-lab="Chemistry">Chemistry Lab</button>
          <button onclick="activeLab='Biology'; renderAll();" class="lab-btn px-3.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100" data-lab="Biology">Biology Lab</button>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <input type="text" id="searchInput" onkeyup="renderAll()" placeholder="Search SKU, Name, Spec..." class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-xs w-52" />
          <div id="actionButtonsArea" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

      <!-- EQUIPMENT INVENTORY TABLE -->
      <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-bold text-sm text-slate-800">Laboratory Equipment & Chemical Inventory</h3>
          <span id="eqCountBadge" class="text-[11px] text-slate-500">0 items</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/90 border-b border-slate-200 text-[11px] font-semibold text-slate-500 uppercase">
                <th class="p-3.5">SKU / Photo</th>
                <th class="p-3.5">Item Name & Specs</th>
                <th class="p-3.5">Lab / Type</th>
                <th class="p-3.5 text-center">Total</th>
                <th class="p-3.5 text-center">Available</th>
                <th class="p-3.5 text-center">Reserved / Damaged</th>
                <th class="p-3.5">Stock & Expiry Status</th>
                <th
