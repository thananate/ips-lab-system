<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Asset System | Equipment & Asset Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="sharedHeader" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"></div>

      <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <!-- REQUEST FORM -->
        <div class="xl:col-span-2 glass-card rounded-2xl p-6">
          <h3 class="font-bold text-base text-slate-800 mb-4 flex items-center gap-2">
            <i data-lucide="file-plus-2" class="w-5 h-5 text-indigo-600"></i> Submit New Equipment / Asset Request
          </h3>

          <form id="requestForm" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Laboratory / Department Room *</label>
                <select id="reqLab" onchange="refreshAvailableItems()" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white"></select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Course / Subject / Activity *</label>
                <input type="text" id="reqSubject" required placeholder="e.g., Grade 10 Chemistry / Office Event" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Usage Date *</label>
                <input type="date" id="reqDate" onchange="refreshAvailableItems()" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-1">Start Time *</label>
                  <input type="time" id="reqStart" onchange="refreshAvailableItems()" value="08:30" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-1">End Time *</label>
                  <input type="time" id="reqEnd" onchange="refreshAvailableItems()" value="10:30" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Purpose / Experiment Details *</label>
              <input type="text" id="reqPurpose" required placeholder="e.g., Acid-Base Titration Lab / Meeting Setup" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
            </div>

            <!-- ITEM PICKER -->
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
              <div class="text-xs font-bold text-slate-700">Select Items & Quantities</div>
              <div class="flex flex-wrap gap-2">
                <select id="itemPickerSelect" class="flex-1 min-w-[200px] px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white"></select>
                <input type="number" id="itemPickerQty" min="1" value="1" class="w-20 px-3 py-2 rounded-xl border border-slate-200 text-xs text-center" />
                <button type="button" onclick="addItemToCart()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700">
                  + Add Item
                </button>
              </div>

              <div id="cartItemsList" class="space-y-2"></div>
            </div>

            <div class="flex justify-end pt-2">
              <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white text-xs font-semibold shadow hover:opacity-95">
                Submit Request
              </button>
            </div>
          </form>
        </div>

        <!-- MY REQUESTS HISTORY -->
        <div class="glass-card rounded-2xl p-6 space-y-4">
          <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
            <i data-lucide="clock" class="w-5 h-5 text-purple-600"></i> My Recent Requests
          </h3>
          <div id="myRequestsList" class="space-y-2.5 max-h-[540px] overflow-y-auto pr-1"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="firebase-core.js"></script>
  <script>
    let cart = [];

    initIPSPage({
      activePage: 'request',
      title: 'Equipment & Asset Request',
      subtitle: 'Book laboratory equipment, chemicals, or office assets with real-time slot availability',
      allowedRoles: ['Teacher', 'Staff', 'Office Staff', 'Admin', 'Super Admin'],
      onReady: () => {
        populateLabDropdown();
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('reqDate').value = tomorrow.toISOString().slice(0, 10);
        refreshAvailableItems();
        renderCart();
        renderMyRequests();
      }
    });

    function populateLabDropdown() {
      const labs = getUserAllowedLabs(window.IPS.user);
      document.getElementById('reqLab').innerHTML = labs.map(l => `<option value="${l}">${l}</option>`).join('');
    }

    function refreshAvailableItems() {
      const lab = document.getElementById('reqLab').value;
      const date = document.getElementById('reqDate').value;
      const start = document.getElementById('reqStart').value;
      const end = document.getElementById('reqEnd').value;

      const items = (window.IPS.equipments || []).filter(e => e.lab === lab && (e.status || 'Active') === 'Active');
      const sel = document.getElementById('itemPickerSelect');

      if (items.length === 0) {
        sel.innerHTML = '<option value="">No active items in this room</option>';
        return;
      }

      sel.innerHTML = items.map(eq => {
        const slotAvail = getAvailableForTimeSlot(eq.id, date, start, end);
        return `<option value="${eq.id}">${eq.name} ${eq.formula ? '(' + eq.formula + ')' : ''} — Available: ${slotAvail} ${eq.unit || 'pcs'}</option>`;
      }).join('');
    }

    function addItemToCart() {
      const eqDocId = document.getElementById('itemPickerSelect').value;
      const qty = Number(document.getElementById('itemPickerQty').value || 0);
      if (!eqDocId || qty <= 0) return;

      const eq = (window.IPS.equipments || []).find(e => e.id === eqDocId);
      if (!eq) return;

      const date = document.getElementById('reqDate').value;
      const start = document.getElementById('reqStart').value;
      const end = document.getElementById('reqEnd').value;
      const maxAvail = getAvailableForTimeSlot(eq.id, date, start, end);

      const existing = cart.find(c => c.eqDocId === eqDocId);
      const totalRequested = (existing ? existing.requestedQty : 0) + qty;

      if (totalRequested > maxAvail) {
        return Swal.fire('Insufficient Stock', `Only ${maxAvail} ${eq.unit || 'pcs'} available for this time slot.`, 'warning');
      }

      if (existing) {
        existing.requestedQty += qty;
      } else {
        cart.push({
          eqDocId: eq.id,
          equipmentId: eq.equipmentId || '',
          name: eq.name,
          unit: eq.unit || 'pcs',
          isConsumable: isConsumableOrChemical(eq),
          requestedQty: qty
        });
      }
      renderCart();
    }

    function removeCartItem(idx) {
      cart.splice(idx, 1);
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 italic py-2">No items added yet. Select an item above and click "+ Add Item".</div>';
        return;
      }
      container.innerHTML = cart.map((item, idx) => `
        <div class="flex items-center justify-between p-2.5 rounded-xl bg-white border border-slate-200 text-xs">
          <div>
            <span class="font-bold text-slate-800">${item.name}</span>
            <span class="ml-2 px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-semibold">${item.requestedQty} ${item.unit}</span>
          </div>
          <button type="button" onclick="removeCartItem(${idx})" class="text-rose-500 hover:text-rose-700 font-medium text-[11px]">Remove</button>
        </div>
      `).join('');
    }

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (cart.length === 0) {
        return Swal.fire('Empty Request', 'Please add at least one item before submitting.', 'warning');
      }

      const start = document.getElementById('reqStart').value;
      const end = document.getElementById('reqEnd').value;
      if (start >= end) {
        return Swal.fire('Invalid Time', 'End time must be after start time.', 'warning');
      }

      const reqCode = 'REQ-' + String((window.IPS.requests || []).length + 1).padStart(3, '0');
      await db.collection('requests').add({
        requestCode: reqCode,
        lab: document.getElementById('reqLab').value,
        subject: document.getElementById('reqSubject').value.trim(),
        useDate: document.getElementById('reqDate').value,
        startTime: start,
        endTime: end,
        purpose: document.getElementById('reqPurpose').value.trim(),
        items: cart,
        requesterUid: window.IPS.user.uid,
        requesterName: window.IPS.user.name,
        requesterEmail: window.IPS.user.email || '',
        requesterRole: window.IPS.user.role,
        createdAt: new Date().toISOString().slice(0, 10),
        status: 'Pending'
      });

      cart = [];
      renderCart();
      document.getElementById('reqPurpose').value = '';
      Swal.fire('Request Submitted', `Your request ${reqCode} is now pending Lab Staff approval.`, 'success');
    });

    function renderMyRequests() {
      const uid = (window.IPS.user || {}).uid;
      const myReqs = (window.IPS.requests || []).filter(r => r.requesterUid === uid || r.requesterEmail === (window.IPS.user || {}).email);
      const container = document.getElementById('myRequestsList');

      if (myReqs.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 text-center py-6">You have not submitted any requests yet.</div>';
        return;
      }

      const badgeColors = {
        'Pending': 'bg-amber-100 text-amber-800',
        'Approved': 'bg-blue-100 text-blue-800',
        'Returned': 'bg-emerald-100 text-emerald-800',
        'Rejected': 'bg-rose-100 text-rose-800'
      };

      container.innerHTML = myReqs.slice().reverse().map(r => `
        <div class="p-3.5 rounded-xl border border-slate-200 bg-white/80 space-y-1.5 text-xs">
          <div class="flex items-center justify-between">
            <span class="font-mono font-bold text-indigo-700">${r.requestCode || r.id.slice(0, 6)}</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${badgeColors[r.status] || 'bg-slate-100'}">${r.status}</span>
          </div>
          <div class="font-bold text-slate-800">${r.subject || r.purpose}</div>
          <div class="text-[11px] text-slate-500">${r.lab} • ${r.useDate} (${r.startTime} - ${r.endTime})</div>
          <div class="text-[11px] text-slate-600 pt-1 border-t border-slate-100">
            ${(r.items || []).map(i => `• ${i.name} (${i.requestedQty} ${i.unit})`).join('<br>')}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
