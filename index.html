<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Lab System | หน้าหลักและสารบัญระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Prompt', 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- LOGIN VIEW -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-2xl p-8">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg text-white">
          <i data-lucide="flask-conical" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-700 to-purple-700 bg-clip-text text-transparent">IPS Lab System</h1>
        <p class="text-sm text-slate-500 mt-1">ระบบบริหารจัดการและเบิก-คืนอุปกรณ์ห้องปฏิบัติการ</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">อีเมลผู้ใช้งาน (Email)</label>
          <input type="email" id="emailInput" required placeholder="thepsintopskul.thananate@ips.ac.th" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน (Password)</label>
          <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium text-sm shadow-md hover:opacity-95">
          เข้าสู่ระบบ
        </button>
      </form>
    </div>
  </div>

  <!-- DIRECTORY DASHBOARD VIEW -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-2xl font-bold text-slate-800">สารบัญระบบ IPS Lab</h2>
          <p class="text-xs text-slate-500">เลือกโมดูลที่ต้องการใช้งานตามสิทธิ์ของคุณ</p>
        </div>
      </div>

      <!-- เมนูสารบัญ 6 หน้าหลัก -->
      <div id="directoryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- สรุปตัวเลข KPI -->
      <div id="kpiRow" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

      <!-- กราฟและแจ้งเตือน Low Stock -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass-card rounded-2xl p-5 lg:col-span-2">
          <h4 class="font-bold text-sm text-slate-800 mb-3">จำนวนอุปกรณ์แยกตามห้องปฏิบัติการ (4 Labs)</h4>
          <div class="h-60"><canvas id="labChart"></canvas></div>
        </div>
        <div class="glass-card rounded-2xl p-5">
          <h4 class="font-bold text-sm text-rose-600 mb-3 flex items-center gap-1.5"><i data-lucide="alert-triangle" class="w-4 h-4"></i> แจ้งเตือน Low Stock</h4>
          <div id="lowStockBox" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="firebase-core.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('emailInput').value.trim(),
          document.getElementById('passwordInput').value
        );
      } catch (err) {
        Swal.fire('เข้าสู่ระบบไม่สำเร็จ', err.message, 'error');
      }
    });

    let chartObj = null;

    initIPSPage({
      activePage: 'index',
      title: 'สารบัญระบบ',
      subtitle: '',
      requireLogin: false,
      onReady: (user) => {
        if (!user) {
          document.getElementById('loginSection').classList.remove('hidden');
          document.getElementById('dashboardSection').classList.add('hidden');
          return;
        }
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');

        const cards = [
          { href: 'request.html', title: '1. จองเบิกอุปกรณ์ (Request)', desc: 'ส่งคำขอเบิกอุปกรณ์ เช็กตารางจองซ้ำ และดูประวัติของฉัน', icon: 'file-plus-2', color: 'blue', roles: ['Teacher', 'Admin', 'Super Admin'] },
          { href: 'approve.html', title: '2. อนุมัติเบิกอุปกรณ์ (Lab Staff)', desc: 'อนุมัติรายชิ้น บางส่วน เสนอของทดแทน และบันทึกคืนของ', icon: 'check-square', color: 'emerald', roles: ['Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'stock.html', title: '3. คลังอุปกรณ์ & Stock', desc: 'จัดการรายการอุปกรณ์ 4 Labs และประวัติปรับยอด Stock', icon: 'boxes', color: 'purple', roles: ['Teacher', 'Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'purchase.html', title: '4. สั่งซื้ออุปกรณ์ (Procurement)', desc: 'สร้างคำขอจัดซื้อ ติดตามสถานะ PO และรับของเข้าคลัง', icon: 'shopping-cart', color: 'amber', roles: ['Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'report.html', title: '5. รายงานและสถิติ (Reports)', desc: 'ออกรายงาน 10 รูปแบบ Export Excel (.xlsx) / CSV / PDF', icon: 'bar-chart-3', color: 'indigo', roles: ['Admin', 'Super Admin'] },
          { href: 'admin.html', title: '6. จัดการสิทธิ์ผู้ใช้ (Admin)', desc: 'กำหนด Role และห้องปฏิบัติการที่รับผิดชอบในระบบ', icon: 'users', color: 'rose', roles: ['Admin', 'Super Admin'] }
        ];

        document.getElementById('directoryCards').innerHTML = cards
          .filter(c => c.roles.includes(user.role))
          .map(c => `
            <a href="${c.href}" class="glass-card rounded-2xl p-5 hover:scale-[1.02] transition block border-l-4 border-l-${c.color}-600">
              <div class="flex items-center justify-between">
                <div class="p-3 rounded-xl bg-${c.color}-100 text-${c.color}-600"><i data-lucide="${c.icon}" class="w-6 h-6"></i></div>
                <i data-lucide="arrow-up-right" class="w-5 h-5 text-slate-400"></i>
              </div>
              <h3 class="font-bold text-slate-800 mt-3 text-sm">${c.title}</h3>
              <p class="text-xs text-slate-500 mt-1">${c.desc}</p>
            </a>
          `).join('');

        const lowItems = window.IPS.equipments.filter(e => Number(e.available) <= Number(e.minStock) && e.status === 'Active');
        const pendingReqs = window.IPS.requests.filter(r => r.status === 'Pending');

        document.getElementById('kpiRow').innerHTML = `
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">รายการอุปกรณ์ทั้งหมด</div><div class="text-2xl font-bold mt-1">${window.IPS.equipments.length} <span class="text-xs font-normal text-slate-400">รายการ</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">คำขอรออนุมัติ</div><div class="text-2xl font-bold text-amber-600 mt-1">${pendingReqs.length} <span class="text-xs font-normal text-slate-400">คำขอ</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">แจ้งเตือน Low Stock</div><div class="text-2xl font-bold text-rose-600 mt-1">${lowItems.length} <span class="text-xs font-normal text-slate-400">รายการ</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">รายการรอจัดซื้อ</div><div class="text-2xl font-bold text-indigo-600 mt-1">${window.IPS.purchases.filter(p => p.status !== 'Received').length} <span class="text-xs font-normal text-slate-400">รายการ</span></div></div>
        `;

        document.getElementById('lowStockBox').innerHTML = lowItems.length === 0
          ? '<p class="text-xs text-slate-400">ไม่มีรายการ Low Stock</p>'
          : lowItems.map(i => `
              <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-100 flex items-center justify-between text-xs">
                <div><b>${i.name}</b> (${i.lab})<br><span class="text-rose-600">เหลือ ${i.available} / ขั้นต่ำ ${i.minStock}</span></div>
                <a href="purchase.html" class="px-2 py-1 rounded-lg bg-rose-600 text-white text-[11px]">สั่งซื้อ</a>
              </div>
            `).join('');

        const labs = ['Primary', 'Physics', 'Chemistry', 'Biology'];
        if (chartObj) chartObj.destroy();
        chartObj = new Chart(document.getElementById('labChart'), {
          type: 'bar',
          data: {
            labels: labs,
            datasets: [
              { label: 'พร้อมใช้', data: labs.map(l => window.IPS.equipments.filter(e => e.lab === l).reduce((s, e) => s + Number(e.available || 0), 0)), backgroundColor: '#6366f1', borderRadius: 6 },
              { label: 'ถูกจอง', data: labs.map(l => window.IPS.equipments.filter(e => e.lab === l).reduce((s, e) => s + Number(e.reserved || 0), 0)), backgroundColor: '#c084fc', borderRadius: 6 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    });
    lucide.createIcons();
  </script>
</body>
</html>
