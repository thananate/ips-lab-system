<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Borrowing System | Dashboard & Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <!-- LOGIN & REGISTER VIEW -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-2xl p-8">
      <div class="text-center mb-6">
        <img src="IPS.png" alt="IPS Lab Logo" class="w-16 h-16 mx-auto mb-4 object-contain rounded-2xl bg-white p-1.5 shadow-md border border-slate-100" />
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-700 to-purple-700 bg-clip-text text-transparent">IPS Borrowing System</h1>
        <p class="text-sm text-slate-500 mt-1">Asset Equipment Requisition & Inventory Portal</p>
      </div>

      <!-- MODE TABS -->
      <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl mb-5 text-xs font-semibold">
        <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2 rounded-lg bg-white text-indigo-700 shadow-sm">Sign In</button>
        <button type="button" id="tabRegBtn" onclick="switchAuthTab('register')" class="py-2 rounded-lg text-slate-500 hover:text-slate-700">Teacher Register</button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Email Address</label>
          <input type="email" id="emailInput" required placeholder="user@ips.ac.th" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
          <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium text-sm shadow-md hover:opacity-95">
          Sign In
        </button>
      </form>

      <!-- SELF-REGISTRATION FORM (TEACHER) -->
      <form id="registerForm" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Full Name</label>
          <input type="text" id="regNameInput" required placeholder="e.g., Somsri Science" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">School Email Address</label>
          <input type="email" id="regEmailInput" required placeholder="name@ips.ac.th" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Create Password (min 6 characters)</label>
          <input type="password" id="regPasswordInput" minlength="6" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-medium text-sm shadow-md hover:bg-emerald-700">
          Create Teacher Account
        </button>
      </form>
    </div>
  </div>

  <!-- DIRECTORY DASHBOARD VIEW -->
  <div id="dashboardSection" class="hidden min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-2xl font-bold text-slate-800">IPS Lab System Directory</h2>
          <p class="text-xs text-slate-500">Select a module below based on your assigned role permissions</p>
        </div>
      </div>

      <!-- Module Directory Cards -->
      <div id="directoryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- KPI Summary -->
      <div id="kpiRow" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

      <!-- Analytics Chart & Alerts (Low Stock + Expiry Alerts) -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass-card rounded-2xl p-5 lg:col-span-2">
          <h4 id="labChartTitle" class="font-bold text-sm text-slate-800 mb-3">Equipment Distribution by Room / Laboratory</h4>
          <div class="h-72"><canvas id="labChart"></canvas></div>
        </div>

        <div class="space-y-4">
          <!-- Low Stock Alerts -->
          <div class="glass-card rounded-2xl p-5">
            <h4 class="font-bold text-sm text-rose-600 mb-3 flex items-center gap-1.5">
              <i data-lucide="alert-triangle" class="w-4 h-4"></i> Low Stock Alerts
            </h4>
            <div id="lowStockBox" class="space-y-2 max-h-36 overflow-y-auto"></div>
          </div>

          <!-- Chemical Expiry Alerts -->
          <div class="glass-card rounded-2xl p-5">
            <h4 class="font-bold text-sm text-amber-700 mb-3 flex items-center gap-1.5">
              <i data-lucide="calendar-clock" class="w-4 h-4 text-amber-600"></i> Expiry Alerts (≤ 60 Days)
            </h4>
            <div id="expiryAlertBox" class="space-y-2 max-h-36 overflow-y-auto"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="firebase-core.js"></script>
  <script>
    function switchAuthTab(mode) {
      const isLogin = mode === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('tabLoginBtn').className = isLogin ? 'py-2 rounded-lg bg-white text-indigo-700 shadow-sm' : 'py-2 rounded-lg text-slate-500 hover:text-slate-700';
      document.getElementById('tabRegBtn').className = !isLogin ? 'py-2 rounded-lg bg-white text-emerald-700 shadow-sm' : 'py-2 rounded-lg text-slate-500 hover:text-slate-700';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('emailInput').value.trim(),
          document.getElementById('passwordInput').value
        );
      } catch (err) {
        Swal.fire('Sign In Failed', err.message, 'error');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regNameInput').value.trim();
      const email = document.getElementById('regEmailInput').value.trim();
      const password = document.getElementById('regPasswordInput').value;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('user').doc(cred.user.uid).set({
          uid: cred.user.uid,
          name,
          email,
          role: 'Teacher',
          allowedLabs: []
        });
        Swal.fire('Welcome!', 'Your Teacher account has been created. Please ask Super Admin to assign your room permissions.', 'success');
      } catch (err) {
        Swal.fire('Registration Failed', err.message, 'error');
      }
    });

    function getExpiryInfo(expiryDate) {
      if (!expiryDate) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const exp = new Date(expiryDate);
      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return { state: 'expired', label: `Expired (${expiryDate})` };
      if (diffDays <= 60) return { state: 'soon', label: `Expires in ${diffDays}d (${expiryDate})` };
      return null;
    }

    let chartObj = null;

    initIPSPage({
      activePage: 'index',
      title: 'Dashboard',
      subtitle: '',
      requireLogin: false,
      onReady: (user) => {
        if (!user) {
          document.getElementById('loginSection').classList.remove('hidden');
          document.getElementById('dashboardSection').classList.add('hidden');
          return;
        }
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');

        const allLabs = getAllLabNames();

        const cards = [
          { href: 'request.html', title: '1. Equipment Request', desc: 'Submit requisition requests, check time-slot availability, and track history', icon: 'file-plus-2', color: 'blue', roles: ['Teacher', 'Admin', 'Super Admin'] },
          { href: 'approve.html', title: '2. Device Borrowing Admin Section', desc: 'Review requests item-by-item, partial approvals, alternatives, and returns', icon: 'check-square', color: 'emerald', roles: ['Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'stock.html', title: '3. Inventory & Stock', desc: `Manage equipment across ${allLabs.length} rooms and audit stock movement logs`, icon: 'boxes', color: 'purple', roles: ['Teacher', 'Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'purchase.html', title: '4. Procurement (Purchase)', desc: 'Create purchase requisitions, track PO status, and receive incoming stock', icon: 'shopping-cart', color: 'amber', roles: ['Lab Staff', 'Admin', 'Super Admin'] },
          { href: 'report.html', title: '5. Analytics & Reports', desc: 'Generate 13 specialized reports (including Monthly/Yearly) and export to Excel, CSV, or PDF', icon: 'bar-chart-3', color: 'indigo', roles: ['Admin', 'Super Admin'] },
          { href: 'admin.html', title: '6. User & Lab Management', desc: 'Create/manage rooms, assign user roles (RBAC), and Teacher permissions', icon: 'users', color: 'rose', roles: ['Super Admin'] }
        ];

        document.getElementById('directoryCards').innerHTML = cards
          .filter(c => c.roles.includes(user.role))
          .map(c => `
            <a href="${c.href}" class="glass-card rounded-2xl p-5 hover:scale-[1.02] transition block border-l-4 border-l-${c.color}-600">
              <div class="flex items-center justify-between">
                <div class="p-3 rounded-xl bg-${c.color}-100 text-${c.color}-600"><i data-lucide="${c.icon}" class="w-6 h-6"></i></div>
                <i data-lucide="arrow-up-right" class="w-5 h-5 text-slate-400"></i>
              </div>
              <h3 class="font-bold text-slate-800 mt-3 text-sm">${c.title}</h3>
              <p class="text-xs text-slate-500 mt-1">${c.desc}</p>
            </a>
          `).join('');

        const lowItems = window.IPS.equipments.filter(e => Number(e.available) <= Number(e.minStock) && e.status === 'Active');
        const expiringItems = window.IPS.equipments.filter(e => e.status === 'Active' && getExpiryInfo(e.expiryDate) !== null);
        const pendingReqs = window.IPS.requests.filter(r => r.status === 'Pending');

        document.getElementById('kpiRow').innerHTML = `
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">Total Equipment SKUs</div><div class="text-2xl font-bold mt-1">${window.IPS.equipments.length} <span class="text-xs font-normal text-slate-400">items</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">Pending Requests</div><div class="text-2xl font-bold text-amber-600 mt-1">${pendingReqs.length} <span class="text-xs font-normal text-slate-400">requests</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">Low Stock Alerts</div><div class="text-2xl font-bold text-rose-600 mt-1">${lowItems.length} <span class="text-xs font-normal text-slate-400">items</span></div></div>
          <div class="glass-card rounded-2xl p-4"><div class="text-xs text-slate-500">Expiring / Expired Items</div><div class="text-2xl font-bold text-amber-700 mt-1">${expiringItems.length} <span class="text-xs font-normal text-slate-400">items</span></div></div>
        `;

        document.getElementById('lowStockBox').innerHTML = lowItems.length === 0
          ? '<p class="text-xs text-slate-400">No low stock alerts at the moment.</p>'
          : lowItems.map(i => `
              <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-100 flex items-center justify-between text-xs">
                <div><b>${i.name}</b> (${i.lab})<br><span class="text-rose-600">Available: ${i.available} / Min: ${i.minStock}</span></div>
                ${['Lab Staff', 'Admin', 'Super Admin'].includes(user.role) ? `<a href="purchase.html" class="px-2 py-1 rounded-lg bg-rose-600 text-white text-[11px]">Order</a>` : ''}
              </div>
            `).join('');

        document.getElementById('expiryAlertBox').innerHTML = expiringItems.length === 0
          ? '<p class="text-xs text-slate-400">No chemicals expiring within 60 days.</p>'
          : expiringItems.map(i => {
              const info = getExpiryInfo(i.expiryDate);
              const isExp = info.state === 'expired';
              return `
                <div class="p-2.5 rounded-xl ${isExp ? 'bg-rose-50 border-rose-200' : 'bg-amber-50 border-amber-200'} border flex items-center justify-between text-xs">
                  <div><b>${i.name}</b> (${i.lab})<br><span class="${isExp ? 'text-rose-700 font-semibold' : 'text-amber-800'}">${info.label}</span></div>
                  <a href="stock.html" class="px-2 py-1 rounded-lg ${isExp ? 'bg-rose-600' : 'bg-amber-600'} text-white text-[11px]">Inspect</a>
                </div>
              `;
            }).join('');

        document.getElementById('labChartTitle').innerText = `Equipment Distribution by Room / Laboratory (${allLabs.length} Rooms)`;
        if (chartObj) chartObj.destroy();
        chartObj = new Chart(document.getElementById('labChart'), {
          type: 'bar',
          data: {
            labels: allLabs,
            datasets: [
              { label: 'Available', data: allLabs.map(l => window.IPS.equipments.filter(e => e.lab === l).reduce((s, e) => s + Number(e.available || 0), 0)), backgroundColor: '#6366f1', borderRadius: 6 },
              { label: 'Reserved', data: allLabs.map(l => window.IPS.equipments.filter(e => e.lab === l).reduce((s, e) => s + Number(e.reserved || 0), 0)), backgroundColor: '#c084fc', borderRadius: 6 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    });
    lucide.createIcons();
  </script>
</body>
</html>
