<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPS Lab System | User & Role Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #eef2ff 100%); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.7); box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.08); }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <div class="min-h-screen flex flex-col lg:flex-row">
    <aside id="sharedSidebar" class="bg-white/95 border-r border-slate-200/80 w-full lg:w-64 flex-shrink-0 flex flex-col justify-between"></aside>
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <div id="sharedHeader" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4"></div>

      <!-- ACTION & SEARCH BAR -->
      <div class="glass-card rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
        <div class="text-xs text-slate-600 flex items-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4 text-indigo-600 flex-shrink-0"></i>
          <span>Create user accounts directly here or allow teachers to self-register on the login page.</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input type="text" id="searchUser" onkeyup="renderUsers()" placeholder="Search name, email, or role..." class="px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-xs w-56" />
          <button onclick="openCreateUserModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-white text-xs font-medium shadow hover:opacity-95 flex items-center gap-1.5">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Create New User
          </button>
        </div>
      </div>

      <!-- USERS RBAC TABLE -->
      <div class="glass-card rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <h3 class="font-bold text-sm text-slate-800">Registered System Users & Laboratory Permissions</h3>
          <span id="userCountBadge" class="text-[11px] text-slate-500">0 users</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50/90 border-b border-slate-200 text-[11px] font-semibold text-slate-500 uppercase">
                <th class="p-3.5">User Profile</th>
                <th class="p-3.5">Role (RBAC)</th>
                <th class="p-3.5 text-center">Primary Lab</th>
                <th class="p-3.5 text-center">Physics Lab</th>
                <th class="p-3.5 text-center">Chemistry Lab</th>
                <th class="p-3.5 text-center">Biology Lab</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTbody" class="divide-y divide-slate-100 text-xs"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- CREATE NEW USER MODAL -->
  <div id="createUserModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800">Create New System Account</h3>
        <button onclick="closeCreateUserModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="createUserForm" class="mt-4 space-y-3.5">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Full Name *</label>
          <input type="text" id="newName" required placeholder="e.g., Somchai Jaidee" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Email Address *</label>
          <input type="email" id="newEmail" required placeholder="somchai@ips.ac.th" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Initial Password (min 6 chars) *</label>
          <input type="password" id="newPassword" minlength="6" required placeholder="••••••••" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Assigned Role *</label>
          <select id="newRole" onchange="document.getElementById('newLabBoxes').classList.toggle('hidden', this.value !== 'Lab Staff')" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white">
            <option value="Teacher">Teacher (Request & View Stock)</option>
            <option value="Lab Staff">Lab Staff (Approve & Manage Stock)</option>
            <option value="Admin">Admin (Full Management)</option>
          </select>
        </div>
        <div id="newLabBoxes" class="hidden bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
          <div class="text-[11px] font-semibold text-slate-600">Assign Responsible Laboratories:</div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2"><input type="checkbox" id="chkPrimary" class="accent-indigo-600"> Primary Lab</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="chkPhysics" class="accent-indigo-600"> Physics Lab</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="chkChemistry" class="accent-indigo-600"> Chemistry Lab</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="chkBiology" class="accent-indigo-600"> Biology Lab</label>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeCreateUserModal()" class="px-4 py-2 rounded-xl text-xs text-slate-600 hover:bg-slate-100">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <script src="firebase-core.js"></script>
  <script>
    initIPSPage({
      activePage: 'admin',
      title: 'User & Role Management',
      subtitle: 'Configure Role-Based Access Control (RBAC) and laboratory assignments',
      allowedRoles: ['Admin', 'Super Admin'],
      onReady: () => {
        renderUsers();
      }
    });

    function openCreateUserModal() {
      document.getElementById('createUserForm').reset();
      document.getElementById('newLabBoxes').classList.add('hidden');
      const m = document.getElementById('createUserModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeCreateUserModal() {
      const m = document.getElementById('createUserModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    // Create user via Secondary Firebase App so Admin stays logged in
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const email = document.getElementById('newEmail').value.trim();
      const password = document.getElementById('newPassword').value;
      const role = document.getElementById('newRole').value;

      Swal.fire({ title: 'Creating User Account...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      let secondaryApp = null;
      try {
        secondaryApp = firebase.initializeApp(firebaseConfig, 'SecondaryUserCreator_' + Date.now());
        const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
        const newUid = cred.user.uid;

        await db.collection('user').doc(newUid).set({
          uid: newUid,
          name,
          email,
          role,
          Primary: role === 'Lab Staff' ? document.getElementById('chkPrimary').checked : '',
          Physics: role === 'Lab Staff' ? document.getElementById('chkPhysics').checked : '',
          Chemistry: role === 'Lab Staff' ? document.getElementById('chkChemistry').checked : '',
          Biology: role === 'Lab Staff' ? document.getElementById('chkBiology').checked : ''
        });

        await secondaryApp.auth().signOut();
        await secondaryApp.delete();

        closeCreateUserModal();
        Swal.fire('Account Created', `${name} (${role}) can now sign in with ${email}.`, 'success');
      } catch (err) {
        if (secondaryApp) await secondaryApp.delete().catch(() => {});
        Swal.fire('Failed to Create Account', err.message, 'error');
      }
    });

    function renderUsers() {
      const currentUser = window.IPS.user;
      const isSuperAdmin = currentUser.role === 'Super Admin';
      const q = (document.getElementById('searchUser').value || '').toLowerCase();

      const filtered = window.IPS.users.filter(u =>
        !q || (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (u.role || '').toLowerCase().includes(q)
      );

      document.getElementById('userCountBadge').innerText = `${filtered.length} users`;

      const tbody = document.getElementById('usersTbody');
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">No users found.</td></tr>';
        return;
      }

      const roleColors = {
        'Super Admin': 'bg-rose-100 text-rose-700 border-rose-200',
        'Admin': 'bg-purple-100 text-purple-700 border-purple-200',
        'Lab Staff': 'bg-emerald-100 text-emerald-700 border-emerald-200',
        'Teacher': 'bg-blue-100 text-blue-700 border-blue-200'
      };

      tbody.innerHTML = filtered.map(u => {
        const isTargetSuper = u.role === 'Super Admin';
        const lockEdit = isTargetSuper && !isSuperAdmin;
        const isAllLabsRole = ['Super Admin', 'Admin', 'Teacher'].includes(u.role);

        return `
          <tr class="hover:bg-slate-50/70">
            <td class="p-3.5">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-xs">
                  ${(u.name || 'U').charAt(0).toUpperCase()}
                </div>
                <div>
                  <div class="font-bold text-slate-800 flex items-center gap-1.5">
                    <span>${u.name || '-'}</span>
                    ${!lockEdit ? `<button onclick="editUserName('${u.uid}', '${(u.name || '').replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-indigo-600" title="Edit Display Name"><i data-lucide="pencil" class="w-3 h-3"></i></button>` : ''}
                  </div>
                  <div class="text-[11px] text-slate-400">${u.email || '-'}</div>
                </div>
              </div>
            </td>
            <td class="p-3.5">
              <select onchange="updateUserRole('${u.uid}', this.value)" ${lockEdit ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg border text-xs font-semibold ${roleColors[u.role] || 'bg-white border-slate-200'} disabled:opacity-60">
                ${['Teacher', 'Lab Staff', 'Admin', 'Super Admin'].map(r => `
                  <option value="${r}" ${u.role === r ? 'selected' : ''} ${r === 'Super Admin' && !isSuperAdmin ? 'disabled' : ''}>${r}</option>
                `).join('')}
              </select>
            </td>
            ${['Primary', 'Physics', 'Chemistry', 'Biology'].map(lab => {
              const checked = isAllLabsRole || u[lab] === true || u[lab] === 'true' || u[lab] === 'Yes';
              return `
                <td class="p-3.5 text-center">
                  <input type="checkbox" ${checked ? 'checked' : ''} ${isAllLabsRole || lockEdit ? 'disabled' : ''}
                    onchange="toggleLabAccess('${u.uid}', '${lab}', this.checked)"
                    class="w-4 h-4 accent-indigo-600 rounded cursor-pointer disabled:opacity-40" />
                </td>
              `;
            }).join('')}
            <td class="p-3.5 text-right">
              ${!lockEdit && u.uid !== currentUser.uid ? `
                <button onclick="deleteUserDoc('${u.uid}', '${u.email}')" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50" title="Remove Profile">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : '<span class="text-[10px] text-slate-300">Protected</span>'}
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    async function updateUserRole(uid, newRole) {
      await db.collection('user').doc(uid).update({ role: newRole });
      Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: `Role updated to ${newRole}`, showConfirmButton: false, timer: 1800 });
    }

    async function toggleLabAccess(uid, lab, isChecked) {
      await db.collection('user').doc(uid).update({ [lab]: isChecked });
      Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: `${lab} Lab access updated`, showConfirmButton: false, timer: 1500 });
    }

    function editUserName(uid, currentName) {
      Swal.fire({
        title: 'Edit Display Name',
        input: 'text',
        inputValue: currentName,
        showCancelButton: true,
        confirmButtonText: 'Save'
      }).then(async res => {
        if (res.isConfirmed && res.value.trim()) {
          await db.collection('user').doc(uid).update({ name: res.value.trim() });
          Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Name updated', showConfirmButton: false, timer: 1500 });
        }
      });
    }

    function deleteUserDoc(uid, email) {
      Swal.fire({
        title: 'Remove User Profile?',
        text: `Remove Firestore profile for ${email}?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e11d48',
        confirmButtonText: 'Delete'
      }).then(async res => {
        if (res.isConfirmed) {
          await db.collection('user').doc(uid).delete();
          Swal.fire('Deleted', 'User profile removed from Firestore.', 'success');
        }
      });
    }
  </script>
</body>
</html>
